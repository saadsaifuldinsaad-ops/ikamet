<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم استلام طلبك - قيد المعالجة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .icon-box { font-size: 3rem; color: var(--accent); margin-bottom: 15px; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #f8fafc; }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
        .price-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1.5px dashed var(--accent);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .price-box span { display: block; font-size: 0.85rem; color: var(--text-muted); }
        .price-box .amount { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin-top: 5px; }
        .btn-home {
            display: inline-block;
            width: 100%;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box"><i class="fa-solid fa-circle-check"></i></div>
        <h1>تم استلام طلبك بنجاح!</h1>
        <p>جاري مراجعة طلبك وملفاتك من قبل فريق العمل المختص.</p>
        <div class="price-box">
            <span>المبلغ الإجمالي الواجب دفعه:</span>
            <div class="amount">{{ total_price }} TL</div>
        </div>
        <a href="/" class="btn-home"><i class="fa-solid fa-house" style="margin-left: 8px;"></i> العودة للرئيسية</a>
    </div>
</body>
</html>
