<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب عميل جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">إنشاء حساب جديد</h2>
        
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-gray-300 text-sm mb-1">الاسم الكامل في الموقع</label>
                <input type="text" id="name" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-gray-300 text-sm mb-1">البريد الإلكتروني (يجب أن ينتهي بـ @gmail.com)</label>
                <input type="email" id="email" placeholder="example@gmail.com" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-gray-300 text-sm mb-1">كلمة المرور</label>
                <input type="password" id="password" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200">
                حفظ وتسجيل
            </button>
        </form>
        
        <div id="message" class="mt-4 text-center text-sm"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const msgDiv = document.getElementById('message');

            // 🔴 التحقق الفوري في الواجهة الأمامية (JavaScript)
            if (!email.endsWith('@gmail.com')) {
                msgDiv.className = "mt-4 text-center text-sm text-red-400";
                msgDiv.textContent = "❌ عذراً، يجب أن يكون البريد الإلكتروني من نوع Gmail وينتهي بـ @gmail.com حصراً!";
                return;
            }

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await response.json();

            if (response.ok) {
                msgDiv.className = "mt-4 text-center text-sm text-green-400";
                msgDiv.textContent = "تم إرسال كود التحقق إلى بريدك الإلكتروني بنجاح!";
                setTimeout(() => {
                    window.location.href = `/verify-otp?email=${encodeURIComponent(email)}`;
                }, 1500);
            } else {
                msgDiv.className = "mt-4 text-center text-sm text-red-400";
                msgDiv.textContent = data.error || "حدث خطأ ما، يرجى المحاولة لاحقاً.";
            }
        });
    </script>
</body>
</html>
