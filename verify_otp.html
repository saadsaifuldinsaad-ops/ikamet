<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق الأمني - بوابة الخدمات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #334155;
        }
        .verify-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-container {
            width: 70px;
            height: 70px;
            background: #e0f2fe;
            color: #0284c7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
        }
        h2 {
            color: #0f172a;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .error-message {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .otp-input {
            width: 100%;
            padding: 14px;
            font-size: 24px;
            letter-spacing: 8px;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
            color: #0f172a;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .otp-input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }
        .btn-submit {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.4);
            transform: translateY(-1px);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="verify-card">
        <div class="icon-container">
            🔒
        </div>
        <h2>التحقق الأمني</h2>
        <p>تم إرسال رمز التحقق المكون من 6 أرقام إلى بريدك الإلكتروني. يرجى إدخاله أدناه للمتابعة.</p>

        {% if error_message %}
            <div class="error-message">
                ⚠️ {{ error_message }}
            </div>
        {% endif %}

        <form method="POST">
            {% if email %}
                <input type="hidden" name="email" value="{{ email }}">
            {% endif %}
            <input type="text" name="otp_code" class="otp-input" placeholder="••••••" maxlength="6" autocomplete="off" required autofocus>
            <button type="submit" class="btn-submit">تحقق وانضم</button>
        </form>

        <div class="footer-note">
            نظام حماية الآمان المشفر &copy; 2026
        </div>
    </div>

</body>
</html>
